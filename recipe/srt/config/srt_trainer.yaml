# SRT (Speculative Rollout with Tree-Structured Cache) PPO Trainer Config
#
# This config extends the default PPO trainer config with SRT-specific settings.
# It also includes DAPO defaults for filter_groups and overlong_buffer support.
#
# SRT fields are passed via CLI with "+" prefix to avoid schema conflicts.
#
# Example CLI usage:
#   +actor_rollout_ref.rollout.enable_srt=true
#   +actor_rollout_ref.rollout.srt_max_tree_depth=64
#   +actor_rollout_ref.rollout.srt_hash_token_count=128
#   +actor_rollout_ref.rollout.srt_num_speculative_tokens=24

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# DAPO-compatible data config
data:
  gen_batch_size: ${data.train_batch_size}

# DAPO-compatible reward model config
reward_model:
  reward_manager: dapo
  overlong_buffer:
    enable: False
    len: 0
    penalty_factor: 0.0
    log: False

# DAPO-compatible algorithm config
algorithm:
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False
    metric: null
    max_num_gen_batches: 0
