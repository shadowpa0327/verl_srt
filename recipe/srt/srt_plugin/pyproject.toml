# SRT Plugin for vLLM
#
# This package includes:
# - Suffix cache with C++ extension for high-performance suffix tree operations
# - vLLM patches for suffix decoding speculative generation
# - Proposer implementations for suffix-based speculation
#
# INSTALLATION (single command):
#   pip install -e recipe/srt/srt_plugin
#
# USAGE:
#   Set VERL_SRT_ENABLED=1 to enable suffix decoding at runtime.
#   Without this environment variable, the plugin does nothing.
#
# EXAMPLE:
#   VERL_SRT_ENABLED=1 python my_training_script.py

[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.18", "nanobind>=1.0.0", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-plugin"
version = "0.3.0"
description = "SRT suffix decoding plugin for vLLM with C++ acceleration"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.entry-points."vllm.general_plugins"]
srt_suffix_decoding = "recipe.srt.srt_plugin.patch:srt_plugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["../../.."]
include = ["recipe.srt.srt_plugin*"]
