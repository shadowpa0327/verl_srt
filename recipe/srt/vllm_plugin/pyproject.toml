# SRT vLLM Plugin
#
# This registers the SRT suffix decoding patches with vLLM's plugin system,
# ensuring patches are applied in ALL processes (including EngineCore subprocesses).
#
# INSTALLATION:
#   pip install -e recipe/srt/vllm_plugin
#
# USAGE:
#   Set VERL_SRT_ENABLED=1 to enable suffix decoding.
#   Without this environment variable, the plugin does nothing (safe for normal usage).
#
# EXAMPLE:
#   VERL_SRT_ENABLED=1 python my_training_script.py

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-vllm-plugin"
version = "0.2.0"
description = "SRT suffix decoding plugin for vLLM (controlled by VERL_SRT_ENABLED)"
requires-python = ">=3.10"
dependencies = []  # No dependencies - uses existing vllm and arctic-inference

[project.entry-points."vllm.general_plugins"]
srt_suffix_decoding = "recipe.srt.vllm_plugin.patch:srt_plugin"

[tool.setuptools]
# This is a namespace package - no actual Python modules to include
# The entry point just references the existing recipe.srt.vllm_plugin module
py-modules = []
packages = []
